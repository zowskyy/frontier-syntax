[workspace]
members = [
  "crates/frontier-lexer",
  "crates/frontier-cli",
  "crates/frontier-wasm",
]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/zowskyy/frontier-syntax"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
