[workspace]
members = [".", "frontier-dex"]
resolver = "2"

[package]
name = "frontier"
version = "2.0.0"
edition = "2021"
description = "Frontier Syntax v2.0 — A+ Hard Gate with 7 innovations"
license = "MIT"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["cli", "serde-json", "sha3-hash", "unicode-normalization", "hex"]
cli = []
wasm-slim = []
full = ["serde-wasm-bindgen", "unicode-normalization", "serde-json", "sha3-hash", "hex"]
serde-json = ["dep:serde_json", "dep:serde"]
sha3-hash = ["dep:sha3"]
hex = ["dep:hex"]
unicode-normalization = ["dep:unicode-normalization"]

[dependencies]
hex = { version = "0.4", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
sha3 = { version = "0.10", optional = true }
unicode-normalization = { version = "0.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "0.4.31", default-features = false, features = ["clock", "std"] }
colored = "2.0.4"
notify = "6.1.1"
rustyline = "14.0.0"
signal-hook = "0.3"
toml = "0.8.12"
ark-bn254 = "0.5"
ark-ff = "0.5"
ark-groth16 = "0.5"
ark-r1cs-std = "0.5"
ark-relations = "0.5"
ark-serialize = "0.5"
ark-snark = "0.5"
ark-std = "0.5"
pqcrypto-dilithium = { version = "0.5", features = ["std"] }
pqcrypto-kyber = "0.7"
pqcrypto-traits = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = { version = "0.6", optional = true }
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]

[[bin]]
name = "frontier"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "lighthouse"
path = "src/bin/lighthouse.rs"

[[bin]]
name = "lsp"
path = "src/bin/lsp.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
