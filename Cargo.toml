[package]
name = "frontier"
version = "2.0.0"
edition = "2021"
description = "Frontier Syntax v2.0 — A+ Hard Gate with 7 innovations"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
unicode-normalization = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]

[[bin]]
name = "frontier"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
