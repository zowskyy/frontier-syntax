[package]
name = "frontier"
version = "2.0.0"
edition = "2021"
description = "Frontier Syntax v2.0 — A+ Hard Gate with 7 innovations"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ark-bn254 = "0.5"
ark-ff = "0.5"
ark-groth16 = "0.5"
ark-r1cs-std = "0.5"
ark-relations = "0.5"
ark-serialize = "0.5"
ark-snark = "0.5"
ark-std = "0.5"
hex = "0.4"
pqcrypto-dilithium = { version = "0.5", features = ["std"] }
pqcrypto-kyber = "0.7"
pqcrypto-traits = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
unicode-normalization = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]

[[bin]]
name = "frontier"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
