[package]
name = "frontier-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Frontier Syntax WASM — browser parser/compiler for Lighthouse"

[lib]
crate-type = ["cdylib", "rlib"]
test = false

[dependencies]
frontier-lexer = { path = "../frontier-lexer" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
