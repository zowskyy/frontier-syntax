[package]
name = "frontier-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Frontier Syntax compiler CLI — validate, compile, package"

[[bin]]
name = "frontier"
path = "src/main.rs"

[dependencies]
frontier-lexer = { path = "../frontier-lexer" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
