name: Compiler Gate

on:
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/verify_wasm_codegen.py"
      - "scripts/measure_wasm_size.py"
      - "scripts/tracking.py"
      - "scripts/run_native_self_host.py"
      - "scripts/release_readiness.py"
      - ".github/workflows/compiler-gate.yml"
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "scripts/**"
      - ".github/workflows/compiler-gate.yml"

jobs:
  compiler-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent environment (wasmtime + deps)
        run: |
          bash scripts/install-agent-environment.sh
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version v25.0.0
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
          rustup target add wasm32-unknown-unknown

      - name: Rust library tests
        id: cargo_test
        run: |
          set -o pipefail
          cargo test --lib -p frontier -- --nocapture 2>&1 | tee cargo-test.log
          exit "${PIPESTATUS[0]}"

      - name: Publish cargo test log on failure
        if: failure() && steps.cargo_test.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'cargo-test.log';
            const tail = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8').slice(-12000)
              : 'cargo-test.log missing';
            const body = `## Compiler Gate — cargo test --lib -p frontier failed\n\n\`\`\`\n${tail}\n\`\`\``;
            const issue_number = context.payload.pull_request?.number;
            if (issue_number) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
            core.summary.addRaw(body);
            await core.summary.write();

      - name: WASM codegen wasmtime execution
        id: wasm_verify
        run: |
          set -o pipefail
          python3 scripts/verify_wasm_codegen.py 2>&1 | tee wasm-verify.log
          exit "${PIPESTATUS[0]}"

      - name: Publish wasm verify log on failure
        if: failure() && steps.wasm_verify.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'wasm-verify.log';
            const tail = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8').slice(-8000)
              : 'wasm-verify.log missing';
            const body = `## Compiler Gate — verify_wasm_codegen.py failed\n\n\`\`\`json\n${tail}\n\`\`\``;
            const issue_number = context.payload.pull_request?.number;
            if (issue_number) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
            core.summary.addRaw(body);
            await core.summary.write();

      - name: WASM slim size measurement
        run: python3 scripts/measure_wasm_size.py

      - name: Native self-host probe
        run: python3 scripts/run_native_self_host.py

      - name: Innovation verification (phase 4)
        run: python3 scripts/verify_innovations.py

      - name: main.fr native self-host (phase 5 / M5)
        run: python3 scripts/verify_main_fr_native.py

      - name: Training corpus gate (phase 6)
        run: python3 scripts/training/validate_corpus.py

      - name: Production hardening (phase 7)
        run: python3 scripts/verify_phase7_hardening.py

      - name: Launch gate (phase 8)
        run: python3 scripts/verify_phase8_launch.py --skip-url-check

      - name: Full tracking gate (phases 0-8)
        run: python3 scripts/tracking.py gate

      - name: Release readiness (RC gates)
        run: python3 scripts/release_readiness.py --audit --skip-run || python3 scripts/release_readiness.py --audit
