[package]
name = "frontier-dex"
version = "2.0.0"
edition = "2021"
description = "Formally verified Android DEX decompiler for Frontier Syntax"
license = "MIT"
build = "build.rs"

[lib]
name = "frontier_dex"
path = "src/lib.rs"

[[bin]]
name = "frontier-dex"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
hex = "0.4"
thiserror = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3.10"
